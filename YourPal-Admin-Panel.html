<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourPal Admin Panel prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* YourPal admin panel design system.
   Source: "Yourpal Design System.fig" (pages: Color palette, Typography, Button, Chips).
   Every colour, size and radius in this prototype comes from a token here.
   Where the live dev site differs from the file (it uses #3F51B5 for primary), the file wins. */

:root{
  /* Black and white */
  --white:#FFFFFF; --black:#010611;

  /* Primary (base is 60) */
  --primary-100:#000039; --primary-90:#000052; --primary-80:#000C6C; --primary-70:#162585;
  --primary-60:#303F9F; --primary-50:#4552A9; --primary-40:#5965B2; --primary-30:#838CC5;
  --primary-20:#979FCF; --primary-10:#C1C5E2; --primary-05:#EAECF5;

  /* Secondary (orange, base is 60) */
  --secondary-100:#983400; --secondary-90:#B24D00; --secondary-80:#CB6715; --secondary-70:#E5802E;
  --secondary-60:#FE9A48; --secondary-50:#FEA45A; --secondary-40:#FEB87F; --secondary-30:#FEC291;
  --secondary-20:#FFD6B6; --secondary-10:#FFE1C8; --secondary-05:#FFF5ED;

  /* Accent purple (seen on the live app: program name, membership tile) */
  --purple-60:#8B3FE8; --purple-70:#7B2FA8;

  /* Background */
  --bg-primary:#FFFFFF; --bg-secondary:#F2F5F9; --bg-tertiary:#F1F1F1;

  /* Neutral */
  --neutral-100:#1B242C; --neutral-90:#272E35; --neutral-80:#3A424A; --neutral-70:#4A545E;
  --neutral-60:#555F6D; --neutral-50:#7E8C9A; --neutral-40:#9EA8B3; --neutral-30:#CFD6DD;
  --neutral-20:#DEE3E7; --neutral-10:#F0F3F5; --neutral-05:#F5F7F9;

  /* Text */
  --text-primary:#121212; --text-secondary:#4B5563;

  /* Success */
  --success-100:#0A1F0A; --success-90:#143D14; --success-80:#1F5C1F; --success-70:#297A29;
  --success-60:#339933; --success-50:#47A347; --success-40:#70B870; --success-30:#99CC99;
  --success-20:#ADD6AD; --success-10:#D6EBD6; --success-05:#EBF5EB;

  /* Warning */
  --warning-100:#332701; --warning-90:#664D03; --warning-80:#997404; --warning-70:#CC9A06;
  --warning-60:#FFC107; --warning-50:#FFC720; --warning-40:#FFD451; --warning-30:#FFDA6A;
  --warning-20:#FFECB5; --warning-10:#FFF3CD; --warning-05:#FFF9E6;

  /* Error */
  --error-100:#330E0D; --error-90:#661D1A; --error-80:#992B28; --error-70:#CC3A35;
  --error-60:#FF4842; --error-50:#FF5A55; --error-40:#FF7F7B; --error-30:#FF918E;
  --error-20:#FFB6B3; --error-10:#FFDAD9; --error-05:#FFEDEC;

  /* Info */
  --info-100:#0A3A66; --info-90:#0E5699; --info-80:#1373CC; --info-70:#1682E6;
  --info-60:#1890FF; --info-50:#46A6FF; --info-40:#74BCFF; --info-30:#A3D3FF;
  --info-20:#B9DDFF; --info-10:#D1E9FF; --info-05:#F3F9FF;

  /* Type (Work Sans). Line heights are the ratios in the file. */
  --font:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --h1:24px; --h2:20px; --h3:18px; --h4:16px;       /* line height 1.5 */
  --b1:16px; --b2:14px; --b3:13px; --b4:13px;       /* 1.5, 1.6, 1.6, 1.6 */
  --m3:13px;
  --d1:48px; --d1-lh:56px;   /* display number, not in the Figma type scale */                                         /* 1.6 */
  --lh-tight:1.5; --lh-body:1.6;
  --w-regular:400; --w-medium:500; --w-semibold:600; --w-bold:700; --w-extrabold:800;

  /* Radius and space */
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:20px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;

  /* Elevation (soft, used for menus and drawers only) */
  
}

/* ---------- semantic aliases: every one resolves to a token from the Figma file ---------- */
:root{
  --brand:var(--primary-60); --brand-hover:var(--primary-70);
  --brand-06:var(--primary-05); --brand-10:var(--primary-05); --brand-15:var(--primary-10); --brand-soft:var(--primary-05);
  --ink:var(--text-primary); --slate-700:var(--text-secondary); --slate-500:var(--neutral-50); --slate-200:var(--neutral-20);
  --table-head:var(--neutral-05); --line:var(--neutral-20); --tile:var(--neutral-10);
  --icon-muted:var(--neutral-60); --icon-disabled:var(--neutral-40);
  --dot:var(--error-60); --ok:var(--success-60);
  --live-active-bg:var(--success-05); --live-active-line:var(--success-20); --live-active-ink:var(--success-90);
  --live-pending-bg:var(--warning-10); --live-pending-ink:var(--warning-90);
  --grad-header:linear-gradient(90deg,var(--primary-05),var(--white) 70%);
  --scrim:color-mix(in srgb,var(--neutral-100) 45%,transparent);
  --shadow-card:0 1px 2px color-mix(in srgb,var(--neutral-100) 6%,transparent);
  --shadow-thumb:0 1px 2px color-mix(in srgb,var(--neutral-100) 20%,transparent);
  --shadow-menu:0 8px 24px color-mix(in srgb,var(--neutral-100) 14%,transparent);
  --shadow-drawer:0 8px 40px color-mix(in srgb,var(--neutral-100) 16%,transparent);
}

/* ---------- type styles ---------- */
.t-h1{font:var(--w-bold) var(--h1)/var(--lh-tight) var(--font)}
.t-h2{font:var(--w-bold) var(--h2)/var(--lh-tight) var(--font)}
.t-h3{font:var(--w-semibold) var(--h3)/var(--lh-tight) var(--font)}
.t-h4{font:var(--w-semibold) var(--h4)/var(--lh-tight) var(--font)}
.t-b1{font:var(--w-regular) var(--b1)/var(--lh-tight) var(--font)}
.t-b2{font:var(--w-regular) var(--b2)/var(--lh-body) var(--font)}
.t-b3{font:var(--w-regular) var(--b3)/var(--lh-body) var(--font)}
.t-m1{font:var(--w-medium) var(--b1)/var(--lh-tight) var(--font)}
.t-m2{font:var(--w-medium) var(--b2)/var(--lh-body) var(--font)}
.t-m3{font:var(--w-medium) var(--m3)/var(--lh-body) var(--font)}
.t-m4{font:var(--w-medium) var(--b3)/var(--lh-body) var(--font)}
.t-r5{font:var(--w-regular) var(--b4)/var(--lh-body) var(--font)}
.muted{color:var(--text-secondary)}

/* ---------- buttons: Size L/M/S, type filled/tonal/outline/text, color primary/secondary/error/inherit ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);border:1px solid transparent;border-radius:var(--r-pill);font-family:var(--font);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{cursor:not-allowed}
.btn.l{height:40px;padding:0 var(--s-5);font-size:15px;font-weight:var(--w-bold);line-height:var(--lh-tight)}
.btn.m{height:32px;padding:0 var(--s-4);font-size:var(--m3);font-weight:var(--w-semibold);line-height:var(--lh-tight)}
.btn.s{height:24px;padding:0 var(--s-3);font-size:var(--b3);font-weight:var(--w-medium);line-height:var(--lh-tight)}
.btn.s svg{width:16px;height:16px}
/* filled */
.btn.filled.primary{background:var(--brand);color:var(--white)} .btn.filled.primary:hover{background:var(--brand-hover)}
.btn.filled.secondary{background:var(--secondary-60);color:var(--white)} .btn.filled.secondary:hover{background:var(--secondary-70)}
.btn.filled.error{background:var(--error-60);color:var(--white)} .btn.filled.error:hover{background:var(--error-70)}
.btn.filled.inherit{background:var(--neutral-20);color:var(--neutral-80)} .btn.filled.inherit:hover{background:var(--neutral-30)}
.btn.filled:disabled{background:var(--neutral-20);color:var(--neutral-40)}
/* tonal */
.btn.tonal.primary{background:var(--primary-10);color:var(--primary-60)} .btn.tonal.primary:hover{background:var(--primary-20)}
.btn.tonal.secondary{background:var(--secondary-10);color:var(--secondary-90)} .btn.tonal.secondary:hover{background:var(--secondary-30)}
.btn.tonal.error{background:var(--error-10);color:var(--error-70)} .btn.tonal.error:hover{background:var(--error-20)}
/* outline */
.btn.outline{background:transparent}
.btn.outline.primary{border-color:var(--primary-60);color:var(--primary-60)} .btn.outline.primary:hover{background:var(--primary-05)}
.btn.outline.secondary{border-color:var(--secondary-60);color:var(--secondary-90)} .btn.outline.secondary:hover{background:var(--secondary-10)}
.btn.outline.error{border-color:var(--error-60);color:var(--error-70)} .btn.outline.error:hover{background:var(--error-10)}
.btn.outline.inherit{border-color:var(--neutral-30);color:var(--neutral-80)} .btn.outline.inherit:hover{background:var(--neutral-10)}
.btn.outline:disabled{border-color:var(--neutral-20);color:var(--neutral-40)}
/* text */
.btn.text{background:transparent}
.btn.text.primary{color:var(--primary-60)} .btn.text.primary:hover{background:var(--primary-05)}
.btn.text.secondary{color:var(--secondary-90)} .btn.text.secondary:hover{background:var(--secondary-10)}
.btn.text.error{color:var(--error-70)} .btn.text.error:hover{background:var(--error-10)}
.btn.text.inherit{color:var(--neutral-80)} .btn.text.inherit:hover{background:var(--neutral-10)}
.btn.text:disabled{color:var(--neutral-40)}
/* icon only, 32 square, round */
.iconbtn{width:32px;height:32px;border-radius:var(--r-pill);border:1px solid var(--neutral-20);background:var(--white);display:inline-grid;place-items:center;cursor:pointer;color:var(--neutral-80)}
.iconbtn:hover{background:var(--neutral-10)}
.iconbtn:disabled{color:var(--neutral-40);background:var(--neutral-05);cursor:not-allowed}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- chips: Size M 32, S 24, XS 20 (Figma). Colours are the file's semantic scales. ---------- */
.chip{display:inline-flex;align-items:center;gap:var(--s-1);border-radius:var(--r-pill);font-family:var(--font);font-weight:var(--w-medium);white-space:nowrap;border:1px solid transparent;line-height:16px}
.chip.m{height:32px;padding:0 var(--s-3);font-size:var(--m3)}
.chip.s{height:24px;padding:0 var(--s-3);font-size:var(--m3)}
.chip.xs{height:20px;padding:0 var(--s-2);font-size:var(--m3)}
.chip svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip .av24{width:24px;height:24px;border-radius:50%;background:var(--warning-20);color:var(--text-primary);display:grid;place-items:center;font:var(--w-bold) 13px/1 var(--font);font-style:normal;flex:none}
.chip.m:has(.av24){padding-left:var(--s-1)}
.chip.default{background:var(--neutral-10);color:var(--neutral-80)}
.chip.outlined{background:var(--white);color:var(--neutral-80);border-color:var(--neutral-30)}
.chip.outlined.brandtext{color:var(--primary-60);border-color:var(--primary-10);background:var(--primary-05)}
.chip.act{cursor:pointer}
.chip.primary{background:var(--primary-05);color:var(--primary-60)}
.chip.success{background:var(--success-05);color:var(--success-90);border-color:var(--success-20)}
.chip.warning{background:var(--warning-10);color:var(--warning-90);border-color:var(--warning-20)}
.chip.error{background:var(--error-05);color:var(--error-80);border-color:var(--error-10)}
.chip.info{background:var(--info-05);color:var(--info-90);border-color:var(--info-20)}
.chip.neutral{background:var(--neutral-10);color:var(--neutral-70)}
.chip.selectable{cursor:pointer;background:var(--white);color:var(--neutral-70);border-color:var(--neutral-30)}
.chip.selectable:hover{border-color:var(--primary-60)}
.chip.selectable.on{background:var(--primary-05);color:var(--primary-60);border-color:var(--primary-60);font-weight:var(--w-semibold)}

/* ---------- surfaces ---------- */
.card{background:var(--bg-primary);border:1px solid var(--neutral-20);border-radius:var(--r-lg);padding:var(--s-4)}
.menu{position:absolute;background:var(--white);border:1px solid var(--neutral-20);border-radius:var(--r-md);box-shadow:var(--shadow-menu);padding:var(--s-1);z-index:40;min-width:180px}
.menu button{display:flex;align-items:center;gap:var(--s-2);width:100%;text-align:left;min-height:40px;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);font:var(--w-medium) var(--b2)/var(--lh-body) var(--font);color:var(--neutral-80);background:none;border:0;cursor:pointer}
.menu button:hover{background:var(--neutral-10)}
.menu button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- form fields ---------- */
.field{display:grid;gap:6px}
.field label{font:var(--w-medium) var(--b3)/var(--lh-body) var(--font);color:var(--neutral-80)}
.field label i{color:var(--error-60);font-style:normal}
.input{height:40px;border:1px solid var(--neutral-30);border-radius:var(--r-md);padding:0 var(--s-3);font:var(--w-regular) var(--b2)/var(--lh-body) var(--font);color:var(--text-primary);background:var(--white);width:100%}
.input::placeholder{color:var(--neutral-40)}
.input:focus{outline:2px solid var(--primary-10);border-color:var(--primary-60)}
.input.err{border-color:var(--error-60)}
.err-text{font:var(--w-regular) var(--b3)/var(--lh-body) var(--font);color:var(--error-70)}

/* control sizes on the 4/8 grid: Large 40, Medium 32, Small 24 for buttons; inputs 40; icon buttons 32 or 40 */
.iconbtn.l{width:40px;height:40px;border-radius:var(--r-md)}
.iconbtn.sq{border-radius:var(--r-md)}
textarea.input{height:auto;min-height:96px;padding:var(--s-2) var(--s-3)}
select.input{padding-right:var(--s-8)}

</style>
<style>
/* Layout and components for the admin panel prototype.
   Structure, content and states copy the live app (dev.rpmfy.com). All spacing and sizing sit on a 4px grid:
   4, 8, 12, 16, 20, 24, 32, 40, 48, 56, 64. Controls: 40 (large), 32 (medium), 24 (small). */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:var(--w-regular) var(--b2)/var(--lh-body) var(--font);color:var(--ink);background:var(--bg-secondary);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
hr{border:0;border-top:1px solid var(--line);margin:0}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}
.hide{display:none!important}
.sp{flex:1}

.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
.col{min-width:0;display:flex;flex-direction:column}

/* ---------- sidebar ---------- */
.side{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sbrand{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font:var(--w-bold) 24px/36px var(--font);color:var(--brand)}
.logo i{width:32px;height:32px;border-radius:var(--r-md);background:var(--brand);display:grid;place-items:center;color:var(--white);font:var(--w-bold) 13px/1 var(--font);font-style:normal}
.sbtn{width:40px;height:32px;border:1px solid var(--line);border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink)}
.sbtn:hover{background:var(--tile)}
.sprog{display:flex;align-items:center;gap:8px;padding:8px;margin:8px;flex:none}
.sback,.sswap{border:1px solid var(--line);border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink);background:var(--white);flex:none}
.sback{width:40px;height:40px}
.sswap{width:32px;height:32px}
.sback:hover,.sswap:hover{background:var(--tile)}
.spn{flex:1;min-width:0}
.spn b{display:block;font:var(--w-bold) 14px/22px var(--font);color:var(--primary-70)}
.spn span{display:block;font:var(--w-semibold) 13px/20px var(--font);letter-spacing:.1px;color:var(--ink)}
.snav{flex:1;overflow:auto;padding:4px 8px 8px;min-height:0}
.grp{display:flex;justify-content:space-between;align-items:center;height:32px;margin-top:8px;padding:0 16px;font:var(--w-semibold) 13px/20px var(--font);letter-spacing:.77px;text-transform:uppercase;color:var(--slate-700)}
.grp .ic{width:16px;height:16px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 8px 0 4px;border-radius:var(--r-md);color:var(--ink);text-align:left}
.nav:hover{background:var(--tile)}
.nav .tile{width:32px;height:32px;border-radius:var(--r-md);background:var(--tile);display:grid;place-items:center;color:var(--slate-700);position:relative;flex:none}
.nav .dot{position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--dot);border:2px solid var(--white)}
.nav .l{flex:1;font:var(--w-medium) var(--b2)/20px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.on{background:var(--brand-soft)}
.nav.on .tile{background:var(--brand);color:var(--white)}
.nav.on .l{font-weight:var(--w-semibold);color:var(--brand)}
.sfoot{border-top:1px solid var(--line);padding:8px;flex:none}
.collapsed .spn,.collapsed .nav .l,.collapsed .grp span,.collapsed .logo b,.collapsed .sswap,.collapsed .sback{display:none}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;flex:0 1 auto;overflow:hidden}
.crumb .ci{display:flex;align-items:center;gap:8px;color:var(--slate-700)}
.crumb .ci .ic{stroke-width:1.5}
.crumb a,.crumb b{font:var(--w-semibold) var(--b2)/20px var(--font);color:var(--ink);max-width:144px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom;cursor:pointer}
.crumb b{cursor:default}
.crumb a:hover{color:var(--brand)}
.gsearch{flex:1 1 160px;min-width:0;max-width:640px;display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--line);border-radius:var(--r-lg);padding:0 12px;color:var(--slate-700);background:var(--white);margin-left:8px}
.gsearch input{border:0;outline:0;flex:1;font:var(--w-regular) var(--b2)/20px var(--font);background:none;color:var(--ink);min-width:0}
.gsearch input::placeholder{color:var(--slate-500)}
.tbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--white);display:grid;place-items:center;color:var(--icon-muted);position:relative}
.tbtn:hover{background:var(--tile)}
.tbtn .ic{width:24px;height:24px;stroke-width:1.5}
.tbtn i{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--dot);border:2px solid var(--white)}
.tdiv{width:1px;height:24px;background:var(--line)}
.me{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--white);position:relative;cursor:pointer}
.av{width:28px;height:28px;border-radius:var(--r-md);background:var(--primary-60);color:var(--white);display:grid;place-items:center;font:var(--w-bold) 14px/1 var(--font)}
.me b{font:var(--w-bold) 14px/22px var(--font);color:var(--ink);white-space:nowrap}
.me .ic{width:16px;height:16px}

/* ---------- page ---------- */
main{padding:24px;min-width:0}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.ph .tt p{color:var(--slate-700);font:var(--w-regular) var(--b2)/20px var(--font);margin-top:4px}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.tile2{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--r-lg);padding:16px;text-align:left;display:block;width:100%;transition:border-color .15s,background .15s}
.tile2:hover{border-color:var(--brand)}
.tile2.on{border-color:var(--brand);background:var(--brand-06)}
.tile2 .h{display:flex;align-items:center;gap:8px;color:var(--ink);font:var(--w-medium) var(--b2)/24px var(--font)}
.tile2 .h .ib{width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center}
.tile2 .h .info{margin-left:auto;color:var(--slate-500)}

/* attendance, waiver */

.sic.b{background:var(--brand-10);color:var(--brand)} .sic.g{background:var(--success-10);color:var(--success-80)} .sic.i{background:var(--info-10);color:var(--info-80)} .sic.o{background:var(--secondary-10);color:var(--secondary-90)}
.stat .l{color:var(--slate-700);font:var(--w-medium) var(--b3)/16px var(--font)}
.stat .v{font:var(--w-bold) 24px/36px var(--font)}
.stat .s{color:var(--slate-700);font:var(--w-regular) 13px/20px var(--font)}
.statusbanner{display:flex;align-items:center;gap:12px;border-radius:var(--r-lg);padding:12px 16px;background:var(--secondary-05);border:1px solid var(--secondary-20);color:var(--secondary-80);margin-bottom:16px}

/* notes page (opened from the row menu) */
.sub-side{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px}
.sub-nav{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--r-lg);padding:16px;align-self:start;display:grid;gap:8px}
.sub-nav .who{display:flex;align-items:center;gap:8px;font:var(--w-bold) var(--b2)/20px var(--font)}
.sub-nav .who i{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--white);display:grid;place-items:center;font:var(--w-bold) 13px/1 var(--font);font-style:normal}
.sub-nav .gt{font:var(--w-semibold) 13px/20px var(--font);letter-spacing:.08em;color:var(--slate-500);margin-top:8px}

/* age slider */
.dual{position:relative;height:48px;margin-top:8px}
.dual .bub{position:absolute;top:0;transform:translateX(-50%);background:var(--neutral-90);color:var(--white);font:var(--w-semibold) 13px/20px var(--font);border-radius:var(--r-sm);padding:0 8px;min-width:32px;text-align:center}
.dual .track{position:absolute;left:0;right:0;top:34px;height:4px;border-radius:var(--r-pill);background:var(--neutral-20)}
.dual .fill{position:absolute;top:34px;height:4px;border-radius:var(--r-pill);background:var(--brand)}
.dual input[type=range]{position:absolute;left:0;top:28px;width:100%;height:16px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input[type=range]::-webkit-slider-runnable-track{background:none;height:16px}
.dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--white);border:2px solid var(--brand);cursor:grab}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--brand);cursor:grab}

.pfxwrap{display:flex}
.pfx{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px;border:1px solid var(--neutral-30);border-right:0;border-radius:var(--r-md) 0 0 var(--r-md);background:var(--white);font:var(--w-medium) var(--b3)/16px var(--font);color:var(--neutral-80);white-space:nowrap}

/* ---------- card with header and body (Profile, Record, Emergency, Personal Details) ---------- */
.card.cd{padding:0;overflow:hidden}

.fgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.fgrid2 .div{grid-column:1/-1;height:1px;background:var(--line)}
.lbl{font:var(--w-semibold) 13px/20px var(--font);letter-spacing:.02em}

  .pager{flex-wrap:wrap}

}

/* Import and Export are icon buttons: grey icon, outline, white background */

/* ---------- leads ---------- */
.tiles.four{grid-template-columns:repeat(4,1fr)}
.stile{background:var(--white);border:1px solid var(--slate-200);border-radius:var(--r-lg);padding:16px}

.stile .h .ib{width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center}
.stile .h .info{margin-left:auto;color:var(--slate-500)}
.stile .n{font:var(--w-semibold) 24px/36px var(--font);margin-top:8px}
.ib.i{background:var(--info-10);color:var(--info-80)} .ib.o{background:var(--warning-10);color:var(--warning-90)}
.stabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--slate-200);padding:0 8px}
.stab{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 12px;color:var(--slate-700);font:var(--w-medium) 14px/22px var(--font);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.stab:hover{color:var(--brand)}
.stab.on{color:var(--brand);font-weight:var(--w-semibold);border-bottom-color:var(--brand)}
.lname b{display:block;font:var(--w-medium) 14px/22px var(--font)}
.lname small{display:block;color:var(--slate-700);font:var(--w-regular) 13px/20px var(--font)}
.pp{display:inline-flex;align-items:center;gap:8px;font:var(--w-medium) 14px/22px var(--font);white-space:nowrap}
.pp i{width:24px;height:24px;border-radius:50%;background:var(--primary-10);color:var(--primary-80);display:grid;place-items:center;font:var(--w-bold) 13px/1 var(--font);font-style:normal}
.score{display:flex;align-items:center;gap:8px}
.score .sb{width:64px;height:4px;border-radius:var(--r-pill);background:var(--neutral-20);overflow:hidden;display:block}
.score .sb i{display:block;height:100%;border-radius:var(--r-pill)}
.score .sb i.r{background:var(--error-60)} .score .sb i.o{background:var(--warning-70)} .score .sb i.g{background:var(--success-60)}
.score b{font:var(--w-bold) 14px/22px var(--font)}
.score b.r{color:var(--error-70)} .score b.o{color:var(--warning-90)} .score b.g{color:var(--success-70)}
.menu .mi:disabled{color:var(--neutral-40);cursor:not-allowed;background:none}
.menu .mi.danger{color:var(--error-70)}
.menu .mi.danger:disabled{color:var(--neutral-40)}
.pkg s{color:var(--slate-500);font-weight:var(--w-regular);font-size:13px}
.pkg .pr{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
@media(max-width:1100px){.tiles.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.tiles.four{grid-template-columns:1fr}}

.lt{min-width:1120px}
.lt th,.lt td{white-space:nowrap;padding-left:12px;padding-right:12px}
.lt th,.lt td{padding-left:8px;padding-right:8px}
.lt th:first-child,.lt td:first-child{padding-left:16px}
.lname{max-width:200px}
.lname b,.lname small{overflow:hidden;text-overflow:ellipsis}
.lt .pp{gap:4px}
/* success badge: the empty-state text rule must not reshape it */
.empty .okbig{display:grid;place-items:center;width:64px;height:64px;max-width:none;flex:none;border-radius:50%;margin-bottom:8px;background:var(--success-05);border:1px solid var(--success-20);color:var(--success-70)}
.empty .okbig .ic{width:32px;height:32px;display:block}

/* transfer membership: source choice, locked card, menu hint */
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mhint{padding:4px 16px 8px;color:var(--slate-700);font:var(--w-regular) 13px/20px var(--font);max-width:240px;white-space:normal}
.mcard.locked{background:var(--neutral-10)}
.mcard.locked .mrow{opacity:.6}
.mcard.locked .phist{background:var(--neutral-10)}
.drawer .plist{max-height:280px;overflow:auto}

/* membership card: details strip, days left bar, freeze history table */
.mstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:12px 16px;border-top:1px solid var(--neutral-10);background:var(--table-head)}
.mstrip small{display:block;color:var(--slate-700);font:var(--w-regular) 13px/20px var(--font)}
.mstrip b{display:block;color:var(--ink);font:var(--w-semibold) 14px/22px var(--font)}
.mdays{display:flex;justify-content:space-between;gap:12px;padding:12px 16px 4px;font:var(--w-medium) 14px/22px var(--font);color:var(--ink)}
.mdays b{font-weight:var(--w-semibold)}
.mbar{margin:0 16px 12px}
.ftw{overflow-x:auto}
.ft{width:100%;border-collapse:collapse}
.ft th{text-align:left;padding:8px 12px;color:var(--slate-700);font:var(--w-semibold) 13px/20px var(--font);border-bottom:1px solid var(--line);white-space:nowrap}
.ft td{padding:8px 12px;font:var(--w-regular) 14px/22px var(--font);color:var(--ink);border-bottom:1px solid var(--neutral-10);white-space:nowrap}
.mcard.locked .mstrip{background:var(--neutral-10)}
@media (max-width:720px){.mstrip{grid-template-columns:1fr 1fr}}
.stack,.mcard,.pbody,.ftw{min-width:0;max-width:100%}
.mcard{display:block}

/* dropdown: rounded trigger and a rounded list with avatar rows, as in the live Assign list */
.dd{position:relative;width:100%}
.ddt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border:1px solid var(--neutral-30);border-radius:var(--r-md);background:var(--white);text-align:left;font:var(--w-regular) var(--b2)/22px var(--font);color:var(--ink);cursor:pointer}
.ddt:hover{border-color:var(--neutral-50)}
.ddt.err{border-color:var(--error-60)}
.dd.open .ddt{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-10)}
.ddt .ic{margin-left:auto;flex:none;color:var(--slate-700);transition:transform .15s}
.dd.open .ddt .ic{transform:rotate(180deg)}
.ddv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ddav{width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;color:var(--white);font:var(--w-bold) 13px/1 var(--font)}
.ddp{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;max-height:296px;overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-menu)}
.dd.open .ddp{display:block}
.ddo{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--neutral-10);color:var(--ink)}

.ddo:hover{background:var(--neutral-05)}

.ddx{flex:1;min-width:0;display:grid;gap:4px}
.ddx b{font:var(--w-semibold) 14px/22px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ddmeta small{color:var(--slate-700);font:var(--w-regular) 13px/20px var(--font)}
.ddck{color:var(--brand);flex:none;display:grid}

/* action menus: roomy rounded list, icon tile, softer hover */
.menu{border-radius:16px;padding:8px;min-width:224px;border:1px solid var(--line)}
.menu .mi{border-radius:12px;padding:8px;gap:12px;min-height:48px}
.menu .mi>.ic{width:32px;height:32px;padding:8px;border-radius:var(--r-sm);background:var(--neutral-10);color:var(--slate-700);flex:none;box-sizing:border-box;transition:background .15s,color .15s}
.menu .mi:hover>.ic{background:var(--brand-10);color:var(--brand)}
.menu .mi.danger>.ic{background:var(--error-05);color:var(--error-70)}
.menu .mi:disabled>.ic{background:var(--neutral-10);color:var(--neutral-40)}
.menu .mi.sel2{border-radius:12px}
.menu .mdiv{margin:4px 8px}
.menu .mhint{padding:0 12px 8px 52px;max-width:264px}
.prow .ddav.lg{width:40px;height:40px;border-radius:var(--r-md)}
.prow .ic-tile{background:var(--primary-60)}
.prow .ddx b{font:var(--w-semibold) 14px/22px var(--font)}
.prow .pamt{flex:none;font:var(--w-semibold) 14px/22px var(--font)}
.plist .prow{border-radius:0}

/* add membership, as on live: icon radio chips, discount with a unit, text Cancel in drawer footers */
.radio button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.radio button .ic{width:16px;height:16px}
.dinp{position:relative;flex:1}
.dinp .input{padding-right:80px}
.dunit{position:absolute;right:4px;top:4px;width:72px}
.dunit .ddt{height:32px;border:0;background:transparent;box-shadow:none;padding:0 8px}
.dunit .ddp{left:auto;right:0;width:96px;top:calc(100% + 12px)}
.dunit .ddo{padding:8px 12px}
.df .btn.text.inherit{font-weight:var(--w-bold)}

/* membership type tabs, dropdown placeholder, roomier drawer and modal buttons */
.ddph{color:var(--slate-500)}
.mtabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.mtab{padding:12px 0;margin-bottom:-1px;border-bottom:3px solid transparent;color:var(--slate-700);font:var(--w-medium) 14px/22px var(--font)}
.mtab:hover{color:var(--ink)}
.mtab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:var(--w-semibold)}
#xfres{min-height:0}
.paybox{display:grid;gap:16px}
.df .btn.m,.mf .btn.m{height:40px;padding:0 var(--s-5);font-size:16px;font-weight:var(--w-bold)}

/* amount fields with a rupee prefix and no spinner; one divider under the tabs; packages scroll sideways */
.cur{position:relative}
.cur>span{position:absolute;left:12px;top:0;line-height:40px;color:var(--slate-700);font:var(--w-medium) var(--b2)/40px var(--font);pointer-events:none}
.cur .input{padding-left:28px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pkgcards{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 12px;margin:-4px -4px 0;scroll-snap-type:x proximity}
.pkgcards .pkg{flex:0 0 200px;scroll-snap-align:start}

/* gender chip in the member header, and the New package / Transferable membership switcher */
.age{align-items:center}
.gen{display:inline-flex;align-items:center;gap:8px;font:var(--w-medium) var(--b3)/20px var(--font);color:var(--slate-700)}
.gen i{display:grid;place-items:center;flex:none;font-style:normal}
.gen i .ic{width:20px;height:20px;stroke-width:2.2}
.gen.m i{color:var(--info-60)}
.gen.f i{color:var(--secondary-60)}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:0;border-radius:var(--r-pill);background:var(--neutral-10)}
.mtab{height:40px;margin:0;padding:0 16px;border:0;border-radius:var(--r-pill);color:var(--slate-700);font:var(--w-medium) 14px/22px var(--font);transition:background .15s,color .15s}
.mtab:hover{color:var(--ink)}
.mtab.on{background:var(--white);color:var(--brand);font-weight:var(--w-semibold);box-shadow:var(--shadow-card)}

/* modal subtitle: member chip with a dark avatar, a divider, then the membership chip */
.subrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.vsep{width:1px;height:20px;background:var(--line)}
.chip .av24.dark{background:var(--neutral-100);color:var(--white)}

/* date picker: quiet white card, centred month, uppercase weekdays, round selected day (brand colour) */
.dpk{position:relative;width:100%}
.dpk>input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.dpt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border:1px solid var(--neutral-30);border-radius:var(--r-md);background:var(--white);text-align:left;font:var(--w-regular) var(--b2)/22px var(--font);color:var(--ink);cursor:pointer}
.dpt:hover{border-color:var(--neutral-50)}
.dpt span{flex:1;min-width:0}
.dpt.empty span{color:var(--slate-500)}
.dpt .ic{margin-left:auto;flex:none;color:var(--slate-700)}
.dpt.ro{background:var(--neutral-05);border-color:var(--neutral-20);color:var(--ink);font-weight:var(--w-medium);cursor:default}
.dpt.ro.empty span{color:var(--neutral-50);font-weight:var(--w-regular)}
.dpt.ro .ic{color:var(--neutral-50)}
.dpt.ro:hover{border-color:var(--neutral-20)}
.dpk.open .dpt{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-10)}
.dpk:has(input.err) .dpt{border-color:var(--error-60)}
.dpp{display:none;position:fixed;z-index:95;width:272px;padding:12px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-menu)}
.dpp.open{display:block}
.dph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.dph b{font:var(--w-semibold) 14px/22px var(--font);color:var(--ink)}
.dpn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--slate-700)}
.dpn:hover{background:var(--neutral-10);color:var(--ink)}
.dpg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.dpg i{height:24px;display:grid;place-items:center;font:var(--w-medium) 13px/20px var(--font);font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500)}
.dpd{height:32px;width:32px;margin:0 auto;border-radius:50%;font:var(--w-medium) 14px/22px var(--font);color:var(--ink)}
.dpd:hover{background:var(--neutral-10)}
.dpd{position:relative}
.dpd.today{color:var(--brand);font-weight:var(--w-bold)}
.dpd.today::after{content:'';position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--brand)}
.dpd.sel::after{display:none}
.dpd.sel,.dpd.sel:hover{background:var(--brand);color:var(--white);box-shadow:none;font-weight:var(--w-semibold)}
.dpf{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--neutral-10)}

/* breadcrumbs: parents are grey and regular, the current page stays dark and semibold */
.crumb a{font-weight:var(--w-regular);color:var(--slate-700)}

.payhint{display:flex;align-items:flex-start;gap:8px;margin:0;color:var(--slate-700);font:var(--w-regular) 13px/20px var(--font)}

/* fields never stretch to the tallest neighbour in a row, so labels and inputs stay aligned */
.field{align-content:start}
.g2,.fgrid,.fgrid2{align-items:start}
.stack>*,.grid2>*,.fgrid2>*{min-width:0;max-width:100%}

/* photos: the initial sits underneath, the portrait covers it */

.pav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;color:var(--white);font:var(--w-bold) 14px/1 var(--font);flex:none}

.pkgcards .pkg{flex:0 0 272px}

.provdd .ddt{width:auto;height:24px;gap:4px;padding:0 4px 0 8px;border:0;border-left:1px solid var(--line);border-radius:0;background:none;box-shadow:none;color:var(--brand);font:var(--w-semibold) var(--b3)/20px var(--font)}
.provdd .ddt:hover{color:var(--brand-hover)}
.provdd .ddph{color:inherit}
.provdd .ddt .ic{width:16px;height:16px;color:inherit}
.provdd .ddp{left:0;right:auto;width:288px}
.dpd{box-sizing:border-box;padding:0;display:grid;place-items:center}

.fstack+.pkgcards{margin-top:16px}
.drawer .db>.sect:first-child,.drawer .db>.fstack>.sect:first-child{border-top:0;margin-top:0;padding-top:0}

/* the transfer option sits quietly at the right end of the Choose your Package heading */
.sectrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sectrow>div{min-width:0}
.sectrow .lnk{display:inline-flex;align-items:center;gap:4px;flex:none;height:32px;padding:0 12px 0 8px;border-radius:var(--r-pill);color:var(--slate-700);background:none;text-transform:none;letter-spacing:0;font:var(--w-medium) 13px/20px var(--font);white-space:nowrap}
.sectrow .lnk:hover{background:var(--neutral-10);color:var(--ink)}

/* popup subtitle: the subscription itself, not the member */
.subd{display:grid;gap:4px;margin-top:4px}
.subn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subn b{font:var(--w-semibold) 14px/22px var(--font);color:var(--ink)}
.subm{font:var(--w-regular) 13px/20px var(--font);color:var(--slate-700)}

.subm{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.subm .vsep{height:16px}
.sx{display:inline-flex;align-items:center;gap:4px}
.sx .ic{color:var(--slate-500)}

/* popup body: the subscription as a small summary card */
.subc{display:grid;gap:12px;padding:12px 16px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:var(--neutral-05)}
.subc .subn{display:flex;align-items:center;gap:8px}
.subt{width:32px;height:32px;border-radius:var(--r-md);background:var(--primary-60);color:var(--white);display:grid;place-items:center;flex:none}
.subt .ic{width:18px;height:18px}
.subg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px 16px}
.subg small{display:flex;align-items:center;gap:4px;font:var(--w-regular) 13px/20px var(--font);color:var(--slate-700)}
.subg small .ic{color:var(--slate-500)}
.subg b{display:block;font:var(--w-semibold) 14px/22px var(--font);color:var(--ink)}

/* membership card: amount first and heavier, duration quieter, split by a thin line */
.ma{gap:12px}
.ma .vsep{height:16px}
.ma .sx{gap:6px}
.ma .amt .ic{color:var(--brand)}
.ma .amt b{font:var(--w-bold) 16px/24px var(--font);color:var(--ink)}
.ma .dur{font:var(--w-medium) 14px/22px var(--font);color:var(--slate-700)}

/* popup subscription: one compact card, tile on the left, details on two quiet lines */
.subc{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:var(--white)}
.subx{min-width:0;display:grid;gap:4px}
.subx .subm .sx .ic{color:var(--slate-500)}
/* membership card amount and duration: calmer colours, one accent each */
.ma .amt .ic{color:var(--success-70)}
.ma .amt b{color:var(--ink)}
.ma .dur{color:var(--slate-700)}
.ma .dur .ic{color:var(--info-60)}
/* one quiet colour for the small icons on the membership card */
.ma .amt .ic,.ma .dur .ic{color:var(--slate-500)}
/* membership name on the card */
.mcard .mt b{font:var(--w-bold) 18px/28px var(--font)}

/* membership icon tiles: tonal fill with a stroke instead of a solid block */
.mtile,.subt,.prow .ic-tile{background:var(--primary-05);color:var(--primary-60);border:1px solid var(--primary-10)}

/* reopen popup: one clear question, the reason as a chip above it */
.rline{margin-bottom:12px}
.rnote{margin:0 0 12px;font:var(--w-regular) 14px/22px var(--font);color:var(--slate-700)}

/* confirmation popup */
.modal.cfm{width:min(400px,92vw);padding:24px;text-align:center;position:relative;border-radius:24px}

.cfi{width:56px;height:56px;margin-bottom:12px;border-radius:50%;display:grid;place-items:center;background:var(--primary-10);color:var(--primary-60);box-shadow:0 0 0 8px var(--primary-05)}
.cfi.warn{background:var(--warning-20);color:var(--warning-90);box-shadow:0 0 0 8px var(--warning-10)}
.cfi .ic{width:24px;height:24px}
.cfb h3{margin:0;font:var(--w-semibold) 20px/28px var(--font);color:var(--ink)}
.cfb p{margin:0;max-width:300px;font:var(--w-regular) 14px/22px var(--font);color:var(--slate-700)}
.cfb p b{color:var(--ink);font-weight:var(--w-semibold)}
.cfb .chip{margin-top:4px}
.cfn{font:var(--w-regular) 13px/20px var(--font);color:var(--slate-700)}
.cff{display:flex;gap:12px}
.cff .btn{flex:1;height:40px;padding:0 var(--s-5);font-size:16px;font-weight:var(--w-bold)}

/* not interested in renewal: a two-part tag, the label first, the reason in lighter text */
.nrchip{display:inline-flex;align-items:center;height:24px;border:1px solid var(--neutral-30);border-radius:var(--r-pill);background:var(--white);font:var(--w-regular) 13px/20px var(--font);color:var(--slate-700);white-space:nowrap;overflow:hidden}
.nrchip .nra{display:inline-flex;align-items:center;gap:4px;height:100%;padding:0 8px 0 6px;background:var(--neutral-10);color:var(--ink);font-weight:var(--w-semibold)}
.nrchip .nra .ic{width:14px;height:14px;color:var(--slate-700)}
.nrchip .nrr{padding:0 10px}
.mt{flex-wrap:wrap}

/* form popup with an icon header (Mark not interested in renewal) */
.modal.nrp .fh{align-items:center;gap:12px}
.modal.nrp .fh .sub{display:flex;align-items:center;gap:8px;margin-top:4px}
.cfi.sm{width:44px;height:44px;margin:0;flex:none;box-shadow:0 0 0 4px var(--warning-10)}
.cfi.sm .ic{width:22px;height:22px}
.modal.nrp .chip.selectable{height:36px;padding:0 16px;font:var(--w-medium) 14px/22px var(--font)}
.modal.nrp .chip.selectable.on{background:var(--primary-60);border-color:var(--primary-60);color:var(--white)}
.modal.nrp .chips{gap:8px}

.cfi.sm{width:48px;height:48px}
.cfi.sm .ic{width:24px;height:24px;stroke-width:2}
/* reason chips: tonal. Soft grey fill at rest, soft brand tint with a brand stroke when picked */
.modal.nrp .chip.selectable{background:var(--neutral-10);border:1px solid transparent;color:var(--neutral-80)}
.modal.nrp .chip.selectable:hover{background:var(--neutral-20)}
.modal.nrp .chip.selectable.on{background:var(--primary-05);border-color:var(--primary-60);color:var(--primary-60);font-weight:var(--w-semibold)}
/* icon circles: calm grey tone instead of amber */
.cfi.warn{background:var(--neutral-10);color:var(--slate-700);box-shadow:0 0 0 8px var(--neutral-05)}
.cfi.sm.warn{box-shadow:0 0 0 4px var(--neutral-05)}

/* popups, after the reference sheet: outlined icon tile and close on top, title and one line under, equal Cancel and action buttons */
.modal.rf{width:min(480px,92vw);padding:24px;border-radius:20px;display:block}
.modal.rf.w560{width:min(560px,92vw)}
.rfh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.rfi{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--primary-60);display:grid;place-items:center;box-shadow:0 1px 2px color-mix(in srgb,var(--neutral-100) 8%,transparent)}
.rfi .ic{width:22px;height:22px}
.rft{margin:0;font:var(--w-semibold) 18px/28px var(--font);color:var(--ink)}
.rfs{margin-top:4px;font:var(--w-regular) 14px/22px var(--font);color:var(--slate-700)}
.rchips{display:inline-flex;align-items:center;gap:8px}
.rfb{margin-top:20px}
.rff{display:flex;gap:12px;margin-top:24px}
.rff .btn{flex:1;height:40px;padding:0 var(--s-5);font-size:16px;font-weight:var(--w-bold)}

/* leads: the stage chip is a dropdown */
.stg{position:relative;display:inline-block}
.stgbtn{cursor:pointer;gap:4px}
.stgbtn .ic{width:14px;height:14px}
.stgbtn:hover{filter:brightness(.97)}
.stg .menu{min-width:240px}
.stg .menu .mi{min-height:40px}

/* stage selector chip: label, a thin divider, then a chevron segment */
.stgbtn{height:28px;padding:0 0 0 10px;gap:6px;overflow:hidden;transition:box-shadow .15s,filter .15s}
.stgbtn .stgc{display:grid;place-items:center;align-self:stretch;width:28px;margin-left:4px;border-left:1px solid color-mix(in srgb,currentColor 28%,transparent)}
.stgbtn .stgc .ic{width:14px;height:14px;transition:transform .15s}
.stgbtn:hover .stgc{background:color-mix(in srgb,currentColor 10%,transparent)}
.stgbtn[aria-expanded="true"]{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
.stgbtn[aria-expanded="true"] .stgc .ic{transform:rotate(180deg)}
.stgbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chip.stgbtn.s{height:28px;padding:0 0 0 12px;gap:6px;overflow:hidden}

/* page actions: import and export together, a divider, then the one primary action */
.tools{display:inline-flex;align-items:center;gap:8px}
.acts-sep{height:24px;margin:0 4px}
/* stage selector chip, take two: no divider line, the chevron sits in a small round handle */
.chip.stgbtn.s{padding:0 4px 0 12px;gap:8px;overflow:visible}
.stgbtn .stgc{width:20px;height:20px;margin:0;align-self:center;border-left:0;border-radius:50%;background:color-mix(in srgb,var(--white) 65%,transparent)}
.stgbtn:hover .stgc{background:color-mix(in srgb,var(--white) 95%,transparent)}
.stgbtn .stgc .ic{width:14px;height:14px}

/* rounded-corner button, to sit with the square icon buttons */
.btn.sqr{border-radius:var(--r-md)}

/* time picker: same field as the date picker, hours and minutes in two scrolling columns */
.tpk{position:relative;width:100%}
.tpk>input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.tpt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border:1px solid var(--neutral-30);border-radius:var(--r-md);background:var(--white);text-align:left;font:var(--w-regular) var(--b2)/22px var(--font);color:var(--ink);cursor:pointer}
.tpt:hover{border-color:var(--neutral-50)}
.tpt span{flex:1;min-width:0}
.tpt.empty span{color:var(--slate-500)}
.tpt .ic{margin-left:auto;flex:none;color:var(--slate-700)}
.tpk.open .tpt{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-10)}
.tpp{display:none;position:fixed;z-index:95;display:none;gap:8px;padding:12px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-menu)}
.tpp.open{display:flex}
.tpc{display:grid;gap:4px;width:72px}
.tph{height:24px;display:grid;place-items:center;font:var(--w-medium) 13px/20px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500)}
.tpl{display:grid;gap:2px;max-height:216px;overflow-y:auto;padding-right:2px;scrollbar-width:thin}
.tpo{height:36px;border-radius:var(--r-md);font:var(--w-medium) 14px/22px var(--font);color:var(--ink)}
.tpo:hover{background:var(--neutral-10)}
.tpo.sel,.tpo.sel:hover{background:var(--brand);color:var(--white);font-weight:var(--w-semibold)}
/* time picker columns scroll, but without visible scrollbars */
.tpl{scrollbar-width:none;-ms-overflow-style:none;padding-right:0}
.tpl::-webkit-scrollbar{display:none;width:0;height:0}

</style>
</head>

/* ---------- members list ---------- */
function visibleMembers(){
  const q = state.q.trim().toLowerCase();
  const rows = members.filter(m => {
    if (state.tile==='active' && m.status!=='Active') return false;
    if (state.tile==='inactive' && m.status!=='Inactive') return false;
    if (q && !(m.name+' '+m.email+' '+m.phone).toLowerCase().includes(q)) return false;
    if (state.filters.tags.length && !state.filters.tags.every(t=>m.tags.includes(t))) return false;
    if (state.filters.date){ const [y,mo,d]=state.filters.date.split('-'); if (m.ts !== +(y+mo+d)) return false; }
    if (m.age!=null && (m.age<state.filters.ageMin || m.age>state.filters.ageMax)) return false;
    return true;
  });
  rows.sort((a,b)=> state.sortDir==='desc' ? b.ts-a.ts : a.ts-b.ts);
  const pin = rows.findIndex(m => m.id==='doli'); if (pin > 0) rows.unshift(rows.splice(pin, 1)[0]);   /* doli jha is the demo member, so it stays first */
  return rows;
}

/* ---------- dropdown ----------
   Replaces the native select. Rows can carry an avatar tile, a name, a chip and a small line, as in the live Assign list. */
function dd(id, opts, o = {}){
  const cur = opts.find(x => String(x.v) === String(o.value == null ? '' : o.value));
  const av = (x, full) => x.av ? `<span class="ddav" style="background:${x.av}">${esc(full ? initials(x.label) : initials(x.label)[0])}${x.img?`<img class="pimg" src="${esc(x.img)}" alt="" onerror="this.remove()">`:''}</span>` : '';
  const face = cur ? `${av(cur)}<span class="ddv">${esc(cur.label)}</span>` : `<span class="ddv ddph">${esc(o.ph||'Select')}</span>`;
  const rows = opts.map(x => `<button type="button" class="ddo ${cur&&x.v===cur.v?'on':''}" role="option" data-ddo="${esc(x.v)}">${av(x, true)}<span class="ddx"><b>${esc(x.label)}</b>${x.tag||x.sub?`<span class="ddmeta">${x.tag?`<span class="chip xs primary">${esc(x.tag)}</span>`:''}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span>`:''}</span>${cur&&x.v===cur.v?`<span class="ddck">${ic('check','sm')}</span>`:''}</button>`).join('');
  return `<div class="dd"><input type="hidden" id="${id}" value="${esc(o.value==null?'':o.value)}"><button type="button" class="ddt ${o.err?'err':''}" data-ddt aria-haspopup="listbox" aria-expanded="false">${face}${ic('chev-d','sm')}</button><div class="ddp" role="listbox">${rows}</div></div>`;
}
const PAY_METHODS = ['Cash','UPI','Card','Bank transfer'];
const payMode = p => p==='m' ? mem.payMode : p==='cv' ? cv.payMode : xf.payMode;
function payAmt(p){
  if (p==='xf') return +xf.fee || 0;
  const k = p==='m' ? PACKAGES.find(x=>x.id===mem.pkg) : LEAD_PKGS.find(x=>x.id===cv.pkg);
  return k ? Math.round(k[p==='m'?'amount':'price']*(1-(p==='m'?mem.applied:cv.applied)/100)) : 0;
}
/* Offline: the money was taken at the desk, so ask for the date and the method. Online: the member pays through the gateway. */
function payBody(p){
  const mode = payMode(p), amt = payAmt(p);
  const tgl = (m, icon) => `<button type="button" class="${mode===m?'on':''}" data-paymode="${p}|${m}">${ic(icon,'sm')}${m}</button>`;
  const modeField = `<div class="field"><label>Mode of Payment <i>*</i></label><div class="radio">${tgl('Offline','receipt')}${tgl('Online','phone')}</div></div>`;
  const top = mode==='Offline'
    ? `<div class="g2">${modeField}<div class="field"><label for="${p}-pdate">Payment Date <i>*</i></label><input class="input" type="date" id="${p}-pdate" value="${isoDate(TODAY)}"></div></div>`
    : `${modeField}<p class="payhint">${ic('info','sm')}<span>${amt?`The member pays <b>${rupee(amt)}</b> through the payment gateway.`:'The member pays through the payment gateway.'} It is recorded when the payment succeeds.</span></p>`;
  const gst = `<div class="field"><label for="${p}-gst">GST Number</label><input class="input" id="${p}-gst" placeholder="22AAAAA0000A1Z5"></div>`;
  const bill = `<div class="field"><label for="${p}-bill">Billing Address</label><textarea class="input" id="${p}-bill" placeholder="Enter billing address"></textarea></div>`;
  const method = `<div class="field"><label>Payment Method <i>*</i></label>${dd(p+'-method', PAY_METHODS.map(x=>({v:x,label:x})), {value:'Cash'})}</div>`;
  return `${top}
    ${mode==='Offline'?`<div class="g2">${method}${gst}</div>${bill}`:`${gst}${bill}`}`;
}
const payRender = p => { const b = $('#'+p+'paybox'); if (b) b.innerHTML = payBody(p); };
const payRefresh = p => { if (payMode(p)==='Online') payRender(p); };
const payRead = p => ({ date: $('#'+p+'-pdate') && $('#'+p+'-pdate').value ? new Date($('#'+p+'-pdate').value) : TODAY, method: payMode(p)==='Online' ? 'Online' : ($('#'+p+'-method') ? $('#'+p+'-method').value : 'Cash') });
const closeDds = () => $$('.dd.open').forEach(d => { d.classList.remove('open'); d.querySelector('[data-ddt]').setAttribute('aria-expanded','false'); });
function ddPick(o){
  const d = o.closest('.dd'), inp = d.querySelector('input'), t = d.querySelector('[data-ddt]');
  inp.value = o.dataset.ddo;
  $$('.ddo', d).forEach(b => { b.classList.toggle('on', b===o); const k = b.querySelector('.ddck'); if (k) k.remove(); });
  o.insertAdjacentHTML('beforeend', `<span class="ddck">${ic('check','sm')}</span>`);
  const a = o.querySelector('.ddav');
  const im = o.querySelector('.pimg');
  t.innerHTML = `${a?`<span class="ddav" style="${a.getAttribute('style')}">${esc(a.textContent[0])}${im?im.outerHTML:''}</span>`:''}<span class="ddv">${esc(o.querySelector('b').textContent)}</span>${ic('chev-d','sm')}`;
  t.classList.remove('err'); closeDds();
  inp.dispatchEvent(new Event('change', {bubbles:true}));
}

function saveMem(){
  const m = curMember(), p = PACKAGES.find(x=>x.id===mem.pkg), sv = $('#mstart').value, start = sv ? new Date(sv) : null;
  $$('.drawer .err-text').forEach(e => e.remove()); $$('.drawer .input.err').forEach(e => e.classList.remove('err'));
  const fail = (el, msg) => { el.classList.add('err'); el.insertAdjacentHTML('afterend', `<span class="err-text">${msg}</span>`); el.scrollIntoView({block:'center'}); };
  if (!p) return fail($('#pkgs'), 'Choose a package');
  if (!start || isNaN(start)) return fail($('#mstart'), 'Enter a start date');
  const final = Math.round(p.amount*(1-mem.applied/100)); let paid = final;
  if (mem.partial) { const el = $('#mpaid'), v = +el.value; if (el.value==='') return fail(el, 'Enter the amount paid now'); if (v > final) return fail(el, 'This is more than the amount to pay'); paid = v; }
  const pay = payRead('m'), end = addDays(start, p.days), renew = mem.mode==='renew';
  m.memberships.unshift({id:'ms'+Date.now(), name:p.name, status:'Active', start:fmtLong(start), amount:final, dur:p.label, paid:paid>0?paid:null, when:fmtLong(pay.date), end:fmtLong(end), daysLeft:Math.max(0,Math.round((end-TODAY)/86400000)), payMode:mem.payMode, payMethod:pay.method});

  if (renew) m.memberships.forEach(x => { if (x.noRenew) delete x.noRenew; });

/* ---------- transfer membership ----------
   The admin does all of it in the CRM, and nothing is member-facing.
   A membership card only marks a membership as ready (Active and fully paid, and not one that arrived by transfer).
   The transfer itself happens in Add Membership and Convert to Member: choose Transferable membership, pick the member
   and the membership, set the start date and a transfer fee, then take the fee as payment.
   Payment history stays with the previous owner. No balance moves, because only fully paid memberships can be marked. */
const isPaid = ms => ms.settled || (ms.paid||0) >= ms.amount;
const canMark = ms => ms.status==='Active' && isPaid(ms) && !ms.from && !ms.to;
const findMs = id => { for (const m of members) { const ms = m.memberships.find(x=>x.id===id); if (ms) return {m, ms}; } return null; };
const readyList = m => m.memberships.filter(x=>x.ready && canMark(x));
const readyMembers = exclude => members.filter(m => m.id!==exclude && readyList(m).length);
const XF_BLANK = () => ({ src:'new', mid:'', msid:null, start:TODAY, fee:'', reason:'', payMode:'Offline', errs:{} });
const xf = Object.assign(XF_BLANK(), { ctx:'add' });
const xfReset = () => Object.assign(xf, XF_BLANK());

const msCard = (m, ms) => `<div class="subc"><span class="subt">${ic('id-card')}</span><div class="subx"><div class="subn"><b>${esc(ms.name)}</b><span class="${MS_CHIP[ms.status]}"><i class="dot"></i>${ms.status}</span></div><div class="subm"><span class="sx">${ic('clock','sm')}${esc(ms.dur)}</span><span class="vsep"></span><span class="sx">${ic('wallet','sm')}${rupee(ms.amount)}</span><span class="vsep"></span><span class="sx">${ic('cal','sm')}${ms.start||'—'} to ${ms.end}</span>${ms.status==='Active'||ms.status==='Frozen'?`<span class="vsep"></span><span class="sx">${ic('hourglass','sm')}${ms.daysLeft} days left</span>`:''}</div></div></div>`;
/* ---------- not interested in renewal ----------
   A flag on the membership, not a new status. It stays until the admin reopens it, and renewing the membership clears it too.
   Only memberships that can still be renewed carry it: Expired, or Active with 15 days or fewer left. */
const NR_REASONS = ['Price','Moving away','Health reasons','Joined another gym','Not enough time','Not seeing results','Facility or equipment','Trainer or service','Taking a break','Other'];
const canRenewFlag = ms => !ms.to && (ms.status==='Expired' || (ms.status==='Active' && ms.daysLeft<=15));

/* ---------- date picker ----------
   Every input[type=date] is upgraded after render: the native input stays in the page, hidden, as the value holder (YYYY-MM-DD),
   so existing code that reads or sets .value keeps working. The visible control shows DD/MM/YYYY and opens one shared calendar.
   The calendar sits on the page (position: fixed) so a drawer or modal never clips it. */
const DP_PROTO = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

const dpDate = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const dpFmt = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const dpPop = document.createElement('div');
dpPop.className = 'dpp'; dpPop.setAttribute('role', 'dialog'); dpPop.setAttribute('aria-label', 'Choose a date');
document.body.appendChild(dpPop);

function dpPaint(inp){

  const t = w.querySelector('.dpt'), v = DP_PROTO.get.call(inp), d = dpDate(v), ro = inp.disabled;

  t.querySelector('span').textContent = d ? (ro ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : dpFmt(v)) : (ro ? 'Set by the package' : 'DD/MM/YYYY');

function tpPlace(r){
  const ph = tpPop.offsetHeight, pw = tpPop.offsetWidth;
  let top = r.bottom + 8; if (top + ph > innerHeight - 8) top = Math.max(8, r.top - 8 - ph);
  tpPop.style.top = top + 'px'; tpPop.style.left = Math.min(Math.max(8, r.left), Math.max(8, innerWidth - pw - 8)) + 'px';
}
document.addEventListener('click', e => {
  const t = e.target, w = t.closest('.tpk') || (t.closest('.tpp') ? tpPop._w : null);
  if (!w) { closeTp(); return; }
  if (t.closest('.tpt')) {
    const open = !w.classList.contains('open'); closeTp();
    if (open) { tpRender(w); tpPop.classList.add('open'); w.classList.add('open'); tpRender(w); tpPlace(w.querySelector('.tpt').getBoundingClientRect()); }
    return;
  }
  const h = t.closest('[data-th]'), m = t.closest('[data-tm]');
  if (h || m) {
    const inp = w.querySelector('input'), cur = tpParts(inp.value) || [9, 0];
    const hh = h ? +h.dataset.th : cur[0], mm = m ? +m.dataset.tm : cur[1];
    DP_PROTO.set.call(inp, pad(hh) + ':' + pad(mm)); tpPaint(inp);
    if (m) closeTp(); else tpRender(w);
    inp.dispatchEvent(new Event('input', {bubbles:true})); inp.dispatchEvent(new Event('change', {bubbles:true}));
  }
});
document.addEventListener('scroll', e => {
  if (!tpPop.classList.contains('open') || tpPop.contains(e.target)) return;
  const w = tpPop._w, r = w && w.isConnected ? w.querySelector('.tpt').getBoundingClientRect() : null;
  if (!r || r.bottom < 0 || r.top > innerHeight) { closeTp(); return; }
  tpPlace(r);
}, true);
window.addEventListener('resize', closeTp);
new MutationObserver(() => { $$('input[type=date]:not([data-dp])').forEach(dpEnhance); $$('input[type=time]:not([data-tp])').forEach(tpEnhance); }).observe(document.body, {childList:true, subtree:true});
$$('input[type=date]:not([data-dp])').forEach(dpEnhance);
$$('input[type=time]:not([data-tp])').forEach(tpEnhance);
})();

</script>
