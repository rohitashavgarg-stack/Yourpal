<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YourPal date picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens, copied from the YourPal design system file */
:root{
  --font:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --white:#FFFFFF; --ink:#121212; --slate-700:#4B5563;
  --brand:#303F9F; --brand-10:#EAECF5; --primary-20:#979FCF;
  --neutral-05:#F5F7F9; --neutral-10:#F0F3F5; --neutral-20:#DEE3E7; --neutral-30:#CFD6DD; --neutral-50:#7E8C9A; --neutral-60:#555F6D;
  --error-60:#F04438;
  --shadow-menu:0 8px 24px rgba(1,6,17,.14);
  --r-md:8px;
}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 360px;font-family:var(--font);color:var(--ink);background:#fff}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.field{max-width:320px}
.field label{display:block;font:500 14px/22px var(--font);margin-bottom:4px}

/* Date field */
.dpk{position:relative;width:100%}
.dpk>input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.dpt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border:1px solid var(--neutral-30);border-radius:var(--r-md);background:var(--white);text-align:left;font:400 14px/22px var(--font);color:var(--ink)}
.dpt:hover{border-color:var(--neutral-50)}
.dpt span{flex:1;min-width:0}
.dpt.empty span{color:var(--neutral-50)}
.dpt svg{margin-left:auto;flex:none;width:16px;height:16px;stroke:var(--slate-700);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dpk.open .dpt{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-10)}

/* Calendar card */
.dpp{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:70;width:272px;max-width:calc(100vw - 48px);padding:12px;background:var(--white);border:1px solid var(--neutral-20);border-radius:16px;box-shadow:var(--shadow-menu)}
.dpk.open .dpp{display:block}
.dpk.up .dpp{top:auto;bottom:calc(100% + 8px)}
.dph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.dph b{font:600 14px/22px var(--font)}
.dpn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--slate-700)}
.dpn:hover{background:var(--neutral-10);color:var(--ink)}
.dpn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dpg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.dpg i{height:24px;display:grid;place-items:center;font:500 13px/20px var(--font);font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--neutral-50)}
.dpd{height:32px;width:32px;margin:0 auto;border-radius:50%;font:500 14px/22px var(--font);color:var(--ink)}
.dpd:hover{background:var(--neutral-10)}
.dpd.today{color:var(--brand);font-weight:700;box-shadow:inset 0 0 0 1px var(--primary-20)}
.dpd.sel,.dpd.sel:hover{background:var(--brand);color:var(--white);box-shadow:none;font-weight:600}
.dpf{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--neutral-10)}
.dpf button{height:32px;padding:0 16px;border-radius:999px;font:600 14px/1 var(--font)}
.dpf [data-clear]{color:var(--slate-700)}
.dpf [data-clear]:hover{background:var(--neutral-10)}
.dpf [data-today]{color:var(--brand)}
.dpf [data-today]:hover{background:var(--brand-10)}
</style>
</head>
<body>

<div class="field">
  <label for="start">Start Date</label>
  <div class="dpk" id="picker">
    <input type="hidden" id="start" value="">
    <button type="button" class="dpt empty" aria-haspopup="dialog">
      <span>DD/MM/YYYY</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
    </button>
    <div class="dpp" role="dialog" aria-label="Choose a date"></div>
  </div>
</div>

<script>
(function(){
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var TODAY = new Date();                       /* the app uses a fixed demo date; here it is the real one */
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var iso = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  var parse = function(v){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; };
  var addDays = function(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; };

  var wrap = document.getElementById('picker'), input = wrap.querySelector('input'),
      trigger = wrap.querySelector('.dpt'), pop = wrap.querySelector('.dpp'), view = null;

  function paint(){
    var v = input.value, m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    trigger.querySelector('span').textContent = m ? m[3]+'/'+m[2]+'/'+m[1] : 'DD/MM/YYYY';
    trigger.classList.toggle('empty', !m);
  }
  function render(){
    var sel = parse(input.value), y = view.getFullYear(), m = view.getMonth(),
        first = new Date(y,m,1), start = addDays(first,-first.getDay()), cells = '';
    for (var i=0;i<42;i++){
      var d = addDays(start,i), id = iso(d);
      cells += d.getMonth()!==m ? '<span></span>'
        : '<button type="button" class="dpd'+(sel&&id===iso(sel)?' sel':'')+(id===iso(TODAY)?' today':'')+'" data-day="'+id+'" aria-label="'+d.getDate()+' '+MONTHS[m]+' '+y+'">'+d.getDate()+'</button>';
    }
    pop.innerHTML =
      '<div class="dph">'+
        '<button type="button" class="dpn" data-nav="-1" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>'+
        '<b>'+MONTHS[m]+' '+y+'</b>'+
        '<button type="button" class="dpn" data-nav="1" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>'+
      '</div>'+
      '<div class="dpg">'+DOW.map(function(x){ return '<i>'+x+'</i>'; }).join('')+cells+'</div>'+
      '<div class="dpf"><button type="button" data-clear>Clear</button><button type="button" data-today>Today</button></div>';
  }
  function choose(v){ input.value = v; paint(); wrap.classList.remove('open'); input.dispatchEvent(new Event('change',{bubbles:true})); }

  trigger.addEventListener('click', function(){
    var open = !wrap.classList.contains('open');
    wrap.classList.remove('open');
    if (open){
      view = parse(input.value) || TODAY; view = new Date(view.getFullYear(), view.getMonth(), 1);
      render(); wrap.classList.add('open');
      var r = wrap.getBoundingClientRect();
      wrap.classList.toggle('up', innerHeight - r.bottom < 360 && r.top > 360);
    }
  });
  pop.addEventListener('click', function(e){
    var nav = e.target.closest('[data-nav]'), day = e.target.closest('[data-day]');
    if (nav){ view = new Date(view.getFullYear(), view.getMonth()+(+nav.dataset.nav), 1); render(); }
    else if (day) choose(day.dataset.day);
    else if (e.target.closest('[data-clear]')) choose('');
    else if (e.target.closest('[data-today]')) choose(iso(TODAY));
  });
  document.addEventListener('click', function(e){ if (!wrap.contains(e.target)) wrap.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') wrap.classList.remove('open'); });
  paint();
})();
</script>
</body>
</html>
